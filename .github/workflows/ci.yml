name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          install-only: true
      - name: Vet
        run: make vet
      - name: Test
        run: make test
      - name: Lint
        run: make lint
      - name: Vulnerability check
        run: make vuln
